<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Enrollment Form — SCHOOL-DB</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://login2explore.com/jpdb/resources/js/0.0.4/jpdb-commons.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 660px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #1a56db 0%, #0e3dab 100%);
      color: #fff;
      padding: 1.5rem 2rem;
    }
    .card-header .db-path {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      opacity: 0.75;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .card-header h1 { font-size: 1.35rem; font-weight: 600; }

    #status-bar {
      font-size: 0.82rem;
      padding: 0.6rem 2rem;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      color: #1e40af;
      min-height: 2.4rem;
    }
    #status-bar.success { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    #status-bar.error   { background: #fff1f2; color: #9f1239; border-color: #fda4af; }
    #status-bar.info    { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
    #status-bar.warning { background: #fffbeb; color: #92400e; border-color: #fcd34d; }

    /* Debug box */
    #debug-box {
      margin: 0.75rem 2rem;
      padding: 0.6rem 0.85rem;
      background: #1e1e2e;
      color: #a6e3a1;
      font-family: monospace;
      font-size: 0.75rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      display: none;
    }
    #debug-box.show { display: block; }

    .card-body { padding: 1.75rem 2rem; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group.full { grid-column: 1 / -1; }

    /* Roll No row — input + Check button side by side */
    .roll-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .roll-row input { flex: 1; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    label .pk-tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 20px;
      margin-left: 5px;
      vertical-align: middle;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: 0.95rem;
      color: #111827;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    input:disabled {
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
      border-color: #e5e7eb;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      padding-top: 1.5rem;
      margin-top: 1rem;
      border-top: 1px solid #f0f0f0;
    }
    button {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-check  { background: #7c3aed; color: #fff; border-color: #6d28d9; flex: 0 0 auto; padding: 0.55rem 1rem; font-size: 0.85rem; }
    #btn-check:hover { background: #6d28d9; }

    #btn-save   { background: #16a34a; color: #fff; border-color: #15803d; }
    #btn-save:hover:not(:disabled)   { background: #15803d; }

    #btn-update { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    #btn-update:hover:not(:disabled) { background: #1d4ed8; }

    #btn-reset  { background: #fff; color: #6b7280; border-color: #d1d5db; }
    #btn-reset:hover:not(:disabled)  { background: #f9fafb; }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
      .card-body { padding: 1.25rem 1rem; }
      .card-header { padding: 1.25rem 1rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <div class="db-path">SCHOOL-DB &rsaquo; STUDENT-TABLE</div>
    <h1>Student Enrollment Form</h1>
  </div>

  <div id="status-bar" class="info">
    &#9432; Enter a Roll No. then click <strong>Check</strong>.
  </div>

  <div id="debug-box"></div>

  <div class="card-body">
    <div class="form-grid">

      <div class="form-group full">
        <label for="roll-no">Roll No <span class="pk-tag">Primary Key</span></label>
        <div class="roll-row">
          <input type="text" id="roll-no" placeholder="e.g. 101"
                 autocomplete="off" maxlength="20" />
          <button id="btn-check">&#128269; Check</button>
        </div>
      </div>

      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="Student full name"
               disabled maxlength="100" />
      </div>

      <div class="form-group">
        <label for="class">Class</label>
        <input type="text" id="class" placeholder="e.g. 10-A"
               disabled maxlength="20" />
      </div>

      <div class="form-group">
        <label for="birth-date">Date of Birth</label>
        <input type="date" id="birth-date" disabled />
      </div>

      <div class="form-group">
        <label for="enroll-date">Enrollment Date</label>
        <input type="date" id="enroll-date" disabled />
      </div>

      <div class="form-group full">
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Full residential address"
               disabled maxlength="200" />
      </div>

    </div>

    <div class="btn-row">
      <button id="btn-save"   disabled>&#10003; Save</button>
      <button id="btn-update" disabled>&#9998; Update</button>
      <button id="btn-reset"  disabled>&#8635; Reset</button>
    </div>

  </div>
</div>

<script>
  /* ══ CONFIG ══════════════════════════════════════════════ */
  const JPDB_TOKEN = "764066046|7385821568319756259|764063843";
  const JPDB_URL   = "http://api.login2explore.com:5577";
  const DB_NAME    = "SCHOOL-DB";
  const REL_NAME   = "STUDENT-TABLE";
  /* ═══════════════════════════════════════════════════════ */

  let currentRecNo = null;

  const fRollNo     = document.getElementById("roll-no");
  const fFullName   = document.getElementById("full-name");
  const fClass      = document.getElementById("class");
  const fBirthDate  = document.getElementById("birth-date");
  const fAddress    = document.getElementById("address");
  const fEnrollDate = document.getElementById("enroll-date");

  const btnCheck  = document.getElementById("btn-check");
  const btnSave   = document.getElementById("btn-save");
  const btnUpdate = document.getElementById("btn-update");
  const btnReset  = document.getElementById("btn-reset");
  const statusBar = document.getElementById("status-bar");
  const debugBox  = document.getElementById("debug-box");

  const dataFields = [fFullName, fClass, fBirthDate, fAddress, fEnrollDate];

  /* ── helpers ── */
  function setStatus(msg, type = "info") {
    statusBar.innerHTML = msg;
    statusBar.className = type;
  }

  function debug(label, data) {
    debugBox.classList.add("show");
    debugBox.textContent = label + ":\n" + JSON.stringify(data, null, 2);
  }

  function resetForm() {
    [fRollNo, fFullName, fClass, fAddress].forEach(f => f.value = "");
    fBirthDate.value = fEnrollDate.value = "";
    currentRecNo = null;
    setIdleState();
  }

  function setIdleState() {
    fRollNo.disabled = false;
    dataFields.forEach(f => f.disabled = true);
    btnSave.disabled = btnUpdate.disabled = btnReset.disabled = true;
    btnCheck.disabled = false;
    setStatus("&#9432; Enter a Roll No. then click <strong>Check</strong>.", "info");
    fRollNo.focus();
  }

  function setNewMode() {
    fRollNo.disabled = false;
    dataFields.forEach(f => { f.disabled = false; });
    btnSave.disabled   = false;
    btnUpdate.disabled = true;
    btnReset.disabled  = false;
    btnCheck.disabled  = true;
    setStatus("&#9711; <strong>New record</strong> — fill in the details and click <strong>Save</strong>.", "info");
    fFullName.focus();
  }

  function setEditMode() {
    fRollNo.disabled   = true;
    dataFields.forEach(f => { f.disabled = false; });
    btnSave.disabled   = true;
    btnUpdate.disabled = false;
    btnReset.disabled  = false;
    btnCheck.disabled  = true;
    setStatus("&#9998; <strong>Record found</strong> — edit and click <strong>Update</strong>.", "success");
    fFullName.focus();
  }

  function validate() {
    const checks = [
      [fRollNo,     "Roll No"],
      [fFullName,   "Full Name"],
      [fClass,      "Class"],
      [fBirthDate,  "Date of Birth"],
      [fAddress,    "Address"],
      [fEnrollDate, "Enrollment Date"],
    ];
    for (const [field, label] of checks) {
      if (!field.value.trim()) {
        setStatus(`&#9888; <strong>${label}</strong> cannot be empty.`, "error");
        field.focus();
        return false;
      }
    }
    return true;
  }

  function getFormJson() {
    return JSON.stringify({
      "Roll-No":         fRollNo.value.trim(),
      "Full-Name":       fFullName.value.trim(),
      "Class":           fClass.value.trim(),
      "Birth-Date":      fBirthDate.value,
      "Address":         fAddress.value.trim(),
      "Enrollment-Date": fEnrollDate.value
    });
  }

  /* ── CHECK (GET_BY_KEY) ── */
  function lookupRollNo() {
    const roll = fRollNo.value.trim();
    if (!roll) {
      setStatus("&#9888; Please enter a Roll No. first.", "error");
      return;
    }

    setStatus("&#8635; Checking Roll No. <strong>" + roll + "</strong>…", "info");

    const reqObj = {
      token  : JPDB_TOKEN,
      cmd    : "GET_BY_KEY",
      dbName : DB_NAME,
      rel    : REL_NAME,
      jsonStr: { "Roll-No": roll }
    };

    debug("REQUEST", reqObj);

    $.ajax({
      url     : JPDB_URL + "/api/irl",
      type    : "POST",
      data    : JSON.stringify(reqObj),
      contentType : "application/json",
      async   : false,
      success : function(res) {
        let result = typeof res === "string" ? JSON.parse(res) : res;
        debug("RESPONSE", result);

        if (result.status === 200) {
          const rec     = result.data.record;
          currentRecNo  = result.data.rec_no;
          fFullName.value   = rec["Full-Name"]        || "";
          fClass.value      = rec["Class"]             || "";
          fBirthDate.value  = rec["Birth-Date"]        || "";
          fAddress.value    = rec["Address"]           || "";
          fEnrollDate.value = rec["Enrollment-Date"]   || "";
          setEditMode();
        } else {
          // status 400 means record not found — allow new entry
          setNewMode();
          setStatus("&#9711; Roll No. <strong>" + roll + "</strong> not found — enter details to save.", "info");
        }
      },
      error : function(xhr, status, err) {
        debug("AJAX ERROR", { status, err, response: xhr.responseText });
        setStatus("&#9888; Connection error: " + err + ". See debug panel below.", "error");
        // Still allow form entry even if server is unreachable
        setNewMode();
      }
    });
  }

  /* ── SAVE ── */
  btnSave.addEventListener("click", () => {
    if (!validate()) return;

    const reqObj = {
      token  : JPDB_TOKEN,
      cmd    : "PUT",
      dbName : DB_NAME,
      rel    : REL_NAME,
      jsonStr: JSON.parse(getFormJson())
    };

    debug("SAVE REQUEST", reqObj);

    $.ajax({
      url  : JPDB_URL + "/api/iml",
      type : "POST",
      data : JSON.stringify(reqObj),
      contentType : "application/json",
      async: false,
      success: function(res) {
        let result = typeof res === "string" ? JSON.parse(res) : res;
        debug("SAVE RESPONSE", result);
        if (result.status === 200) {
          setStatus("&#10003; Student <strong>" + fRollNo.value.trim() + "</strong> saved successfully!", "success");
          setTimeout(resetForm, 1800);
        } else {
          setStatus("&#9888; Save failed: " + result.message, "error");
        }
      },
      error: function(xhr, status, err) {
        debug("SAVE ERROR", { status, err, response: xhr.responseText });
        setStatus("&#9888; Save error: " + err, "error");
      }
    });
  });

  /* ── UPDATE ── */
  btnUpdate.addEventListener("click", () => {
    if (!validate()) return;

    const updateData = {
      "Full-Name"       : fFullName.value.trim(),
      "Class"           : fClass.value.trim(),
      "Birth-Date"      : fBirthDate.value,
      "Address"         : fAddress.value.trim(),
      "Enrollment-Date" : fEnrollDate.value
    };

    const reqObj = {
      token  : JPDB_TOKEN,
      cmd    : "UPDATE",
      dbName : DB_NAME,
      rel    : REL_NAME,
      jsonStr: { [currentRecNo]: updateData }
    };

    debug("UPDATE REQUEST", reqObj);

    $.ajax({
      url  : JPDB_URL + "/api/iml",
      type : "POST",
      data : JSON.stringify(reqObj),
      contentType : "application/json",
      async: false,
      success: function(res) {
        let result = typeof res === "string" ? JSON.parse(res) : res;
        debug("UPDATE RESPONSE", result);
        if (result.status === 200) {
          setStatus("&#10003; Record for <strong>" + fRollNo.value.trim() + "</strong> updated!", "success");
          setTimeout(resetForm, 1800);
        } else {
          setStatus("&#9888; Update failed: " + result.message, "error");
        }
      },
      error: function(xhr, status, err) {
        debug("UPDATE ERROR", { status, err, response: xhr.responseText });
        setStatus("&#9888; Update error: " + err, "error");
      }
    });
  });

  /* ── RESET ── */
  btnReset.addEventListener("click", resetForm);

  /* ── Enter key on Roll No. triggers Check ── */
  fRollNo.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); lookupRollNo(); }
  });

  btnCheck.addEventListener("click", lookupRollNo);

  /* ── Init ── */
  window.addEventListener("load", resetForm);
</script>

</body>
</html>
